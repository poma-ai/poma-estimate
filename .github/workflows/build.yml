name: Build binaries

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15            # arm64
            artifact: poma-estimate-macos-arm64
          - os: macos-15-intel      # x86_64
            artifact: poma-estimate-macos-x86_64
          - os: ubuntu-22.04        # old glibc = runs on more distros
            artifact: poma-estimate-linux-x86_64
          - os: windows-latest
            artifact: poma-estimate-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
      # uv picks the runner's installed CPython 3.12 where there is one (macOS, Windows) and
      # downloads a managed one otherwise (Linux); --locked refuses to build from a drifted lock.
      - name: Install deps
        if: matrix.os != 'macos-15-intel'
        run: uv sync --locked --python 3.12 --group dev
      # No macOS x86_64 wheel exists for cryptography, so it is compiled here. Link OpenSSL
      # statically: otherwise PyInstaller bundles a libssl.3.dylib that does not match the one
      # the compiled module was linked against (v0.2.0 smoke test: SSL_get0_group_name missing).
      # --no-cache: uv's built-wheel cache does not key on OPENSSL_STATIC, so a cached dynamic
      # build (restored by setup-uv) would silently come back.
      - name: Install deps (macOS x86_64, static OpenSSL for the cryptography build)
        if: matrix.os == 'macos-15-intel'
        env:
          OPENSSL_STATIC: "1"
          OPENSSL_DIR: /usr/local/opt/openssl@3
        run: uv sync --locked --python 3.12 --group dev --no-cache
      - name: Build
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          uv run pyinstaller --onefile \
            --name "${{ matrix.artifact }}" \
            --hidden-import tiktoken_ext.openai_public \
            --hidden-import tiktoken_ext \
            --collect-data tiktoken_ext \
            --add-data "src/poma_estimate/data${SEP}poma_estimate/data" \
            --optimize 2 \
            --noconfirm \
            src/poma_estimate/__main__.py
      - name: Smoke test (real run, JSON checked)
        shell: bash
        run: |
          mkdir smoke
          uv run python -c "open('smoke/a.txt','w').write('hello world ' * 3000)"
          ./dist/${{ matrix.artifact }}* smoke --json > out.json
          ./dist/${{ matrix.artifact }}* --version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ./dist/${{ matrix.artifact }}* --version | grep -qF "${GITHUB_REF_NAME#v}"; fi
          uv run python -c "import json; d=json.load(open('out.json')); assert d['total_units']>=5 and d['files_measured']==1 and not d['files'][0]['error'], d"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums + release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && sha256sum poma-estimate-* > SHA256SUMS && cd ..
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "Run the one-line installer from the README."
